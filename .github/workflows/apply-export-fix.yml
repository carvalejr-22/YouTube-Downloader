name: Apply GetMuvi export fix

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix verified custom-folder export and cache cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ github.token }}

      - name: Patch export flow and cache cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main_path = Path('app/src/main/java/com/carlosvale/ytdownloader/MainActivity.kt')
          text = main_path.read_text()
          replacement = '''    private fun exportToTree(context: Context, source: File, treeUri: Uri) {
              val root = DocumentFile.fromTreeUri(context, treeUri)
                  ?: error("Pasta selecionada indisponível")

              val files = source.walkTopDown()
                  .filter { file ->
                      file.isFile &&
                          !file.name.endsWith(".part", ignoreCase = true) &&
                          !file.name.endsWith(".ytdl", ignoreCase = true)
                  }
                  .toList()

              if (files.isEmpty()) {
                  error("O download terminou, mas o arquivo final não foi encontrado para salvar na pasta escolhida.")
              }

              files.forEach { file ->
                  val expectedBytes = file.length()
                  if (expectedBytes <= 0L) {
                      error("O arquivo ${file.name} foi gerado vazio e não será salvo.")
                  }

                  val mime = when (file.extension.lowercase(Locale.ROOT)) {
                      "mp3" -> "audio/mpeg"
                      "m4a" -> "audio/mp4"
                      "aac" -> "audio/aac"
                      "opus" -> "audio/opus"
                      "ogg" -> "audio/ogg"
                      "webm" -> if (file.name.contains("audio", ignoreCase = true)) "audio/webm" else "video/webm"
                      "mkv" -> "video/x-matroska"
                      else -> "video/mp4"
                  }

                  var copied = false
                  var lastError: Throwable? = null

                  for (attempt in 1..2) {
                      try {
                          root.findFile(file.name)?.delete()
                          val target = root.createFile(mime, file.name)
                              ?: error("Não foi possível criar ${file.name}")

                          val copiedBytes = context.contentResolver.openOutputStream(target.uri, "w")?.use { output ->
                              file.inputStream().use { input -> input.copyTo(output) }
                          } ?: error("Não foi possível gravar ${file.name}")

                          if (copiedBytes != expectedBytes) {
                              target.delete()
                              error("A cópia de ${file.name} ficou incompleta ($copiedBytes de $expectedBytes bytes).")
                          }

                          val savedBytes = target.length()
                          if (savedBytes > 0L && savedBytes != expectedBytes) {
                              target.delete()
                              error("A verificação de ${file.name} falhou após a cópia.")
                          }

                          copied = true
                          break
                      } catch (error: Throwable) {
                          lastError = error
                          if (attempt < 2) Thread.sleep(250)
                      }
                  }

                  if (!copied) {
                      throw IllegalStateException(
                          "Não foi possível salvar ${file.name} na pasta escolhida após 2 tentativas.",
                          lastError
                      )
                  }
              }
          }

          private fun compactStatus'''

          pattern = r'    private fun exportToTree\(context: Context, source: File, treeUri: Uri\) \{.*?\n    \}\n\n    private fun compactStatus'
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'exportToTree replacement count={count}')
          main_path.write_text(text)

          app_path = Path('app/src/main/java/com/carlosvale/ytdownloader/YTDownloaderApp.kt')
          app = app_path.read_text()
          marker = 'class YTDownloaderApp : Application() {\n    private val initMutex = Mutex()'
          replacement_app = '''class YTDownloaderApp : Application() {
              private val initMutex = Mutex()

              override fun onCreate() {
                  super.onCreate()
                  Thread({ cleanupStaleExports() }, "getmuvi-cache-cleanup").start()
              }

              private fun cleanupStaleExports() {
                  val cutoff = System.currentTimeMillis() - STALE_EXPORT_MAX_AGE_MS
                  cacheDir.listFiles()
                      ?.filter { it.isDirectory && it.name.startsWith("export-") && it.lastModified() < cutoff }
                      ?.forEach { dir ->
                          runCatching { dir.deleteRecursively() }
                              .onFailure { Log.w(TAG, "Não foi possível limpar temporário antigo: ${dir.name}", it) }
                      }
              }'''
          if marker not in app:
              raise SystemExit('YTDownloaderApp marker not found')
          app = app.replace(marker, replacement_app, 1)

          companion_old = '''    private companion object {
              const val TAG = "GetMuvi"
          }'''
          companion_new = '''    private companion object {
              const val TAG = "GetMuvi"
              const val STALE_EXPORT_MAX_AGE_MS = 60L * 60L * 1000L
          }'''
          if companion_old not in app:
              raise SystemExit('companion marker not found')
          app = app.replace(companion_old, companion_new, 1)
          app_path.write_text(app)

          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text().replace('versionCode = 11', 'versionCode = 12').replace('versionName = "0.3.5"', 'versionName = "0.3.6"')
          gradle.write_text(g)

          build_workflow = Path('.github/workflows/android-build.yml')
          w = build_workflow.read_text().replace('0.3.5', '0.3.6')
          w = w.replace(
              'Primeira distribuição preparada para release de produção: APK assinado, assinatura verificada no CI, AAB para Google Play e checksums SHA-256.',
              'Corrige exportação para pastas personalizadas, valida a cópia antes de confirmar sucesso e limpa temporários antigos automaticamente.'
          )
          build_workflow.write_text(w)

          Path('.github/workflows/apply-export-fix.yml').unlink()
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix verified custom-folder export and cache cleanup"
          git push
