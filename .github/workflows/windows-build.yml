name: Build GetMuvi Windows

on:
  push:
    branches: [ getmuvi-windows-0.1.0 ]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: desktop/requirements.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt

      - name: Generate GetMuvi icon
        shell: pwsh
        run: python desktop/generate_icon.py

      - name: Download FFmpeg LGPL
        shell: pwsh
        run: |
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-package -Force
          $ffmpeg = Get-ChildItem -Path ffmpeg-package -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path ffmpeg-package -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'FFmpeg/FFprobe não encontrados no pacote.' }
          "FFMPEG_BIN_DIR=$($ffmpeg.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build portable EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name GetMuvi `
            --icon desktop/assets/getmuvi.ico `
            --collect-all customtkinter `
            --add-binary "$env:FFMPEG_BIN_DIR\ffmpeg.exe;bin" `
            --add-binary "$env:FFMPEG_BIN_DIR\ffprobe.exe;bin" `
            --distpath desktop/dist `
            --workpath desktop/build `
            desktop/getmuvi_windows.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup não encontrado.' }
          & $iscc desktop\GetMuvi.iss

      - name: Show output sizes
        shell: pwsh
        run: |
          Get-Item desktop\dist\GetMuvi.exe | Format-List Name,Length
          Get-Item desktop\installer-output\GetMuvi-Setup-0.1.0.exe | Format-List Name,Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GetMuvi-Windows-0.1.0
          path: |
            desktop/dist/GetMuvi.exe
            desktop/installer-output/GetMuvi-Setup-0.1.0.exe
          if-no-files-found: error

      - name: Publish Windows release
        if: github.ref == 'refs/heads/getmuvi-windows-0.1.0'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $portable = 'desktop/dist/GetMuvi.exe'
          $installer = 'desktop/installer-output/GetMuvi-Setup-0.1.0.exe'
          if (gh release view windows-v0.1.0 2>$null) {
            gh release upload windows-v0.1.0 $portable $installer --clobber
          } else {
            gh release create windows-v0.1.0 $portable $installer --target getmuvi-windows-0.1.0 --title 'GetMuvi Windows 0.1.0' --notes 'Primeira versão de teste do GetMuvi para Windows. Inclui executável portátil e instalador.'
          }
