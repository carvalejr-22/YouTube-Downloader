name: Build GetMuvi Windows

on:
  push:
    branches: [ getmuvi-windows-0.1.0 ]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  GETMUVI_VERSION: '0.1.3'
  CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
  CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: desktop/requirements.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt

      - name: Apply build version and 0.1.3 UX fixes
        shell: pwsh
        run: |
          $path = 'desktop/getmuvi_windows.py'
          $text = Get-Content $path -Raw
          $text = $text -replace 'APP_VERSION = "[^"]+"', "APP_VERSION = `"$env:GETMUVI_VERSION`""
          $text = $text -replace 'def _ui\(self, fn, \*args\) -> None:', 'def _ui(self, fn, *args, **kwargs) -> None:'
          $text = $text -replace 'self\.after\(0, lambda: fn\(\*args\)\)', 'self.after(0, lambda: fn(*args, **kwargs))'
          Set-Content -Path $path -Value $text -Encoding utf8
          python desktop/apply_v013_fixes.py
          python -m py_compile desktop/getmuvi_windows.py

      - name: Generate official GetMuvi icon
        shell: pwsh
        run: python desktop/generate_icon.py

      - name: Download FFmpeg LGPL
        shell: pwsh
        run: |
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-package -Force
          $ffmpeg = Get-ChildItem -Path ffmpeg-package -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path ffmpeg-package -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'FFmpeg/FFprobe não encontrados no pacote.' }
          "FFMPEG_BIN_DIR=$($ffmpeg.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build portable EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name GetMuvi `
            --icon desktop/assets/getmuvi.ico `
            --version-file desktop/version_info.txt `
            --manifest desktop/getmuvi.manifest `
            --collect-all customtkinter `
            --add-data "desktop/assets/getmuvi.png;assets" `
            --add-data "desktop/assets/getmuvi.ico;assets" `
            --add-binary "$env:FFMPEG_BIN_DIR\ffmpeg.exe;bin" `
            --add-binary "$env:FFMPEG_BIN_DIR\ffprobe.exe;bin" `
            --distpath desktop/dist `
            --workpath desktop/build `
            desktop/getmuvi_windows.py

      - name: Sign portable EXE when certificate is configured
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:CERT_PASSWORD)) {
            Write-Host 'Certificado não configurado. Gerando build de teste sem assinatura Authenticode.'
            exit 0
          }
          [IO.File]::WriteAllBytes('certificate.pfx', [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe não encontrado.' }
          & $signtool.FullName sign /f certificate.pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 desktop\dist\GetMuvi.exe
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao assinar GetMuvi.exe.' }
          & $signtool.FullName verify /pa /v desktop\dist\GetMuvi.exe
          Remove-Item certificate.pfx -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup não encontrado.' }
          & $iscc desktop\GetMuvi.iss

      - name: Sign installer when certificate is configured
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:CERT_PASSWORD)) {
            Write-Host 'Certificado não configurado. Instalador permanece sem assinatura Authenticode.'
            exit 0
          }
          [IO.File]::WriteAllBytes('certificate.pfx', [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe não encontrado.' }
          & $signtool.FullName sign /f certificate.pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 desktop\installer-output\GetMuvi-Setup-0.1.3.exe
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao assinar o instalador.' }
          & $signtool.FullName verify /pa /v desktop\installer-output\GetMuvi-Setup-0.1.3.exe
          Remove-Item certificate.pfx -Force

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            'desktop\dist\GetMuvi.exe',
            'desktop\installer-output\GetMuvi-Setup-0.1.3.exe'
          )
          $checksumFile = 'desktop\SHA256SUMS.txt'
          if (Test-Path $checksumFile) { Remove-Item $checksumFile -Force }
          foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))" | Add-Content -Path $checksumFile -Encoding ascii
          }
          Get-Content $checksumFile

      - name: Show output sizes
        shell: pwsh
        run: |
          Get-Item desktop\dist\GetMuvi.exe | Format-List Name,Length
          Get-Item desktop\installer-output\GetMuvi-Setup-0.1.3.exe | Format-List Name,Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GetMuvi-Windows-0.1.3
          path: |
            desktop/dist/GetMuvi.exe
            desktop/installer-output/GetMuvi-Setup-0.1.3.exe
            desktop/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish Windows release
        if: github.ref == 'refs/heads/getmuvi-windows-0.1.0'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $portable = 'desktop/dist/GetMuvi.exe'
          $installer = 'desktop/installer-output/GetMuvi-Setup-0.1.3.exe'
          $checksums = 'desktop/SHA256SUMS.txt'
          if (gh release view windows-v0.1.3 2>$null) {
            gh release upload windows-v0.1.3 $portable $installer $checksums --clobber
          } else {
            gh release create windows-v0.1.3 $portable $installer $checksums --target getmuvi-windows-0.1.0 --title 'GetMuvi Windows 0.1.3' --notes 'Corrige o layout sem rolagem: remove o grande espaço vazio, sobe os controles e garante que formato, pasta e botão Baixar apareçam na janela padrão. Corrige também o instalador com mutex para impedir múltiplas instâncias e sem abertura automática após concluir. Mantém identidade Android, metadados oficiais, manifesto, SHA-256 e pipeline pronto para Authenticode.'
          }
