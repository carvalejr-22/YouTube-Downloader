name: Build GetMuvi APK

on:
  push:
    branches: [ main, getmuvi-0.3.2-opt ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply GetMuvi 0.3.2 optimizations
        run: python3 scripts/apply_0_3_2_optimizations.py

      - name: Persist optimized source
        shell: bash
        run: |
          if ! git diff --quiet -- app/src/main/java/com/carlosvale/ytdownloader/MainActivity.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/carlosvale/ytdownloader/MainActivity.kt
            git commit -m "GetMuvi 0.3.2: otimizar fluxo e botão de pasta [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APKs
        run: gradle :app:assembleDebug --stacktrace

      - name: Show APK sizes
        run: find app/build/outputs/apk/debug -name '*.apk' -exec ls -lh {} \;

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: GetMuvi-0.3.2-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
