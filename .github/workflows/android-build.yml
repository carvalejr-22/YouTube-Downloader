name: Build GetMuvi APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APKs
        run: gradle :app:assembleDebug --stacktrace

      - name: Show APK sizes
        run: find app/build/outputs/apk/debug -name '*.apk' -exec ls -lh {} \;

      - name: Upload arm64 test APK
        uses: actions/upload-artifact@v4
        with:
          name: GetMuvi-0.3.2-arm64-v8a
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error

      - name: Upload universal test APK
        uses: actions/upload-artifact@v4
        with:
          name: GetMuvi-0.3.2-universal
          path: app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: error
