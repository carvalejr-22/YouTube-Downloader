name: Build GetMuvi APK

on:
  push:
    branches: [ main, getmuvi-0.3.0-test ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply approved GetMuvi branding
        run: python3 scripts/apply_approved_branding.py

      - name: Persist branding source update
        shell: bash
        run: |
          if ! git diff --quiet -- app/src/main/java/com/carlosvale/ytdownloader/MainActivity.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/carlosvale/ytdownloader/MainActivity.kt
            git commit -m "GetMuvi 0.3.1: aplicar wordmark e arte aprovados [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GetMuvi-0.3.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
