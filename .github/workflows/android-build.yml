name: Build GetMuvi Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Fix Kotlin regex when needed
        shell: bash
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/fix_regex.py
          python3 /tmp/fix_regex.py
          if ! git diff --quiet -- app/src/main/java/com/carlosvale/ytdownloader/MainActivity.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/carlosvale/ytdownloader/MainActivity.kt
            git commit -m "Fix Kotlin media fragment regex"
            git push
          fi

      - name: Build debug APKs for testing
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload arm64 test APK
        uses: actions/upload-artifact@v4
        with:
          name: GetMuvi-0.3.7-arm64-v8a-debug
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
