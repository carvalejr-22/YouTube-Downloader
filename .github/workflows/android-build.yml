name: Build GetMuvi Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Apply 0.3.7 final media path fix when needed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text()
          if 'versionName = "0.3.7"' in g:
              raise SystemExit(0)

          path = Path('app/src/main/java/com/carlosvale/ytdownloader/MainActivity.kt')
          text = path.read_text()

          anchor = 'private const val PROGRESS_UI_DELTA = 0.01f\nprivate val STATUS_WHITESPACE = Regex("\\\\s+")'
          if anchor not in text:
              raise SystemExit('constants anchor not found')
          text = text.replace(
              anchor,
              'private const val PROGRESS_UI_DELTA = 0.01f\nprivate const val FINAL_PATH_MARKER = "__GETMUVI_FINAL__"\nprivate val STATUS_WHITESPACE = Regex("\\\\s+")',
              1
          )

          old_request = '''        val request = YoutubeDLRequest(url)
              .addOption("-o", File(outputDir, outputTemplate).absolutePath)
              .addOption("--trim-filenames", "64")'''
          new_request = '''        val request = YoutubeDLRequest(url)
              .addOption("--paths", "home:${outputDir.absolutePath}")
              .addOption("--paths", "temp:${outputDir.absolutePath}")
              .addOption("-o", outputTemplate)
              .addOption("--print", "after_move:$FINAL_PATH_MARKER%(filepath)s")
              .addOption("--trim-filenames", "64")'''
          if old_request not in text:
              raise SystemExit('download request block not found')
          text = text.replace(old_request, new_request, 1)

          old_vars = '''                var lastUiUpdateAt = 0L
                var lastUiProgress = -1f

                YoutubeDL.getInstance().execute(request, currentProcessId) { itemProgress, eta, line ->
                    val overallProgress = if (totalItems > 1) {'''
          new_vars = '''                var lastUiUpdateAt = 0L
                var lastUiProgress = -1f
                var reportedFinalPath: String? = null

                YoutubeDL.getInstance().execute(request, currentProcessId) { itemProgress, eta, line ->
                    val markerIndex = line.indexOf(FINAL_PATH_MARKER)
                    if (markerIndex >= 0) {
                        reportedFinalPath = line.substring(markerIndex + FINAL_PATH_MARKER.length)
                            .trim()
                            .takeIf { it.isNotBlank() }
                    }

                    val overallProgress = if (totalItems > 1) {'''
          if old_vars not in text:
              raise SystemExit('progress callback block not found')
          text = text.replace(old_vars, new_vars, 1)

          old_compact = '                        val compactLine = if (line.isNotBlank()) compactStatus(line) else ""'
          new_compact = '                        val compactLine = if (markerIndex < 0 && line.isNotBlank()) compactStatus(line) else ""'
          if old_compact not in text:
              raise SystemExit('compact status block not found')
          text = text.replace(old_compact, new_compact, 1)

          old_end = '''                }
                Unit
            }

            processId = null'''
          new_end = '''                }

                val reportedFile = reportedFinalPath?.let(::File)
                if (reportedFile != null && reportedFile.isFile && reportedFile.length() > 0L) {
                    val realSource = reportedFile.canonicalFile
                    val realOutputDir = outputDir.canonicalFile
                    if (!realSource.toPath().startsWith(realOutputDir.toPath())) {
                        val rescued = File(outputDir, realSource.name)
                        realSource.copyTo(rescued, overwrite = true)
                        if (!rescued.isFile || rescued.length() != realSource.length()) {
                            error("O arquivo final foi localizado, mas não pôde ser movido para a área temporária do GetMuvi.")
                        }
                    }
                }

                val templatePrefix = outputTemplate.substringBefore("%(").takeIf { it.isNotBlank() }
                val finalFiles = outputDir.walkTopDown()
                    .filter { file ->
                        isExportableMediaFile(file) &&
                            (templatePrefix == null || file.name.startsWith(templatePrefix))
                    }
                    .toList()

                if (finalFiles.isEmpty()) {
                    error("O mecanismo concluiu o processo, mas não entregou um arquivo de mídia final ao GetMuvi.")
                }
                Unit
            }

            processId = null'''
          if old_end not in text:
              raise SystemExit('execute completion block not found')
          text = text.replace(old_end, new_end, 1)

          old_export_filter = '''        .filter { file ->
            file.isFile &&
                !file.name.endsWith(".part", ignoreCase = true) &&
                !file.name.endsWith(".ytdl", ignoreCase = true)
        }'''
          if old_export_filter not in text:
              raise SystemExit('export filter block not found')
          text = text.replace(old_export_filter, '        .filter(::isExportableMediaFile)', 1)

          marker = '    private fun exportToTree(context: Context, source: File, treeUri: Uri) {'
          helper = '''    private fun isExportableMediaFile(file: File): Boolean {
        if (!file.isFile || file.length() <= 0L) return false

        val lowerName = file.name.lowercase(Locale.ROOT)
        if (
            lowerName.endsWith(".part") ||
            lowerName.endsWith(".ytdl") ||
            lowerName.endsWith(".tmp") ||
            Regex("\\\\.f\\\\d+\\\\.[^.]+$").containsMatchIn(lowerName)
        ) return false

        return file.extension.lowercase(Locale.ROOT) !in setOf(
            "json", "description", "jpg", "jpeg", "png", "webp", "vtt", "srt", "ass"
        )
    }

    private fun exportToTree(context: Context, source: File, treeUri: Uri) {'''
          if marker not in text:
              raise SystemExit('export function marker not found')
          text = text.replace(marker, helper, 1)
          path.write_text(text)

          g = g.replace('versionCode = 12', 'versionCode = 13')
          g = g.replace('versionName = "0.3.6"', 'versionName = "0.3.7"')
          gradle.write_text(g)
          PY

          if ! git diff --quiet -- app/src/main/java/com/carlosvale/ytdownloader/MainActivity.kt app/build.gradle.kts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/carlosvale/ytdownloader/MainActivity.kt app/build.gradle.kts
            git commit -m "Fix yt-dlp final media path handling"
            git push
          fi

      - name: Build debug APKs for testing
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload arm64 test APK
        uses: actions/upload-artifact@v4
        with:
          name: GetMuvi-0.3.7-arm64-v8a-debug
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error

      - name: Check production signing configuration
        id: signing
        shell: bash
        run: |
          if [[ -n "$SIGNING_KEYSTORE_BASE64" && -n "$SIGNING_STORE_PASSWORD" && -n "$SIGNING_KEY_ALIAS" && -n "$SIGNING_KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Production signing secrets are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Production signing secrets are not configured; signed release publishing will be skipped."
          fi

      - name: Materialize production keystore
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/getmuvi-upload.jks"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "SIGNING_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APKs and Play Store AAB
        if: steps.signing.outputs.ready == 'true'
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify APK signature
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-arm64-v8a-release.apk
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-universal-release.apk

      - name: Prepare signed distribution files
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk GetMuvi-0.3.7-arm64-v8a.apk
          cp app/build/outputs/apk/release/app-universal-release.apk GetMuvi-0.3.7-universal.apk
          cp app/build/outputs/bundle/release/app-release.aab GetMuvi-0.3.7.aab
          sha256sum GetMuvi-0.3.7-arm64-v8a.apk GetMuvi-0.3.7-universal.apk GetMuvi-0.3.7.aab > SHA256SUMS.txt

      - name: Upload signed release artifacts
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GetMuvi-0.3.7-signed-release
          path: |
            GetMuvi-0.3.7-arm64-v8a.apk
            GetMuvi-0.3.7-universal.apk
            GetMuvi-0.3.7.aab
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish signed GitHub release
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.7 >/dev/null 2>&1; then
            gh release upload v0.3.7 GetMuvi-0.3.7-arm64-v8a.apk GetMuvi-0.3.7-universal.apk GetMuvi-0.3.7.aab SHA256SUMS.txt --clobber
          else
            gh release create v0.3.7 \
              GetMuvi-0.3.7-arm64-v8a.apk \
              GetMuvi-0.3.7-universal.apk \
              GetMuvi-0.3.7.aab \
              SHA256SUMS.txt \
              --title "GetMuvi 0.3.7" \
              --notes "Corrige o caminho final do yt-dlp/FFmpeg, força temporários e mídia final para a mesma área e resgata o arquivo quando o mecanismo o move para outro local."
          fi
